# Source: GitHub starter workflow "Simple workflow" (MIT) — https://github.com/actions/starter-workflows/blob/main/ci/blank.yml
#
# Repaired by repocurator (feature 002):
#   - `push` and `pull_request` triggered on `main`; this repository's default
#     branch is `master`, so the workflow had never run on a push to it.
#   - the lint job checked only that actions were SHA-pinned; it now also
#     installs dependencies and runs this project's own `yarn lint`
#     (`eslint src --ext ts,tsx --report-unused-disable-directives
#     --max-warnings 0`, from package.json).
#   - the test job ran the starter's placeholder echo; it now installs
#     dependencies, runs `yarn build` (`tsc && vite build`, from
#     package.json) and then `scripts/smoke-test.mjs`, a smoke test added by
#     repocurator because this repository had no test of any kind. It checks
#     that the build actually produced a loadable dist/index.html and a
#     non-empty JS bundle under dist/assets.
#
# Fixed, pre-existing: at the time of this repair, both `yarn lint` and
# `yarn build` failed against this repository's own source -- tsconfig.json
# sets noUnusedLocals/noUnusedParameters, and several files under
# src/**/*.tsx(x) imported names (SimpleList, ReferenceField, useMediaQuery,
# Theme, and others) they never used, which both tsc and eslint's
# --max-warnings 0 correctly rejected. Those unused imports were removed
# from the app's own source so both checks pass honestly, without loosening
# either check.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# The workflow token is read-only by default.
# Grant extra permissions to a single job only when that job needs them.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that actions are pinned to full commit SHAs
        shell: bash
        run: |
          # Every `uses:` must reference a full 40-character commit SHA followed by a
          # version comment, for example:
          #   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          # Local actions (./path) and Docker images (docker://) are skipped.
          set -euo pipefail
          unpinned="$(grep -RnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows \
            | grep -vE "uses:[[:space:]]*['\"]?(\./|docker://)" \
            | grep -vE "@[0-9a-f]{40}['\"]?[[:space:]]+#[[:space:]]*v?[0-9]" || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::Pin these actions to a full-length commit SHA with a version comment:"
            echo "$unpinned"
            exit 1
          fi
          echo "All actions are pinned to full-length commit SHAs."

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Test
        run: node scripts/smoke-test.mjs
